<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doodle Symmetry</title>
<style>
  :root { --bg: #0e0e16; --panel: #191926; --text: #e8e8f0; --accent: #7c5cff; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; padding: 10px 16px; background: var(--panel); }
  h1 { font-size: 16px; margin: 0 8px 0 0; }
  label { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  button:hover { filter: brightness(1.15); }
  button.secondary { background: #2c2c40; }
  main { flex: 1; position: relative; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
</style>
</head>
<body>
<header>
  <h1>Doodle Symmetry</h1>
  <label>Mirrors <input id="slices" type="range" min="2" max="16" value="8"><span id="slicesVal">8</span></label>
  <label>Brush <input id="size" type="range" min="1" max="24" value="3"></label>
  <label><input id="rainbow" type="checkbox" checked> Rainbow</label>
  <label>Color <input id="color" type="color" value="#7c5cff"></label>
  <button id="undo" class="secondary">Undo</button>
  <button id="clear" class="secondary">Clear</button>
  <button id="save">Save PNG</button>
</header>
<main><canvas id="c"></canvas></main>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);

let strokes = [];   // each: {slices, size, points:[{x,y,color}]} in center-relative coords
let current = null;
let hue = 0;

function resize() {
  const r = canvas.getBoundingClientRect();
  canvas.width = r.width * devicePixelRatio;
  canvas.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  redraw();
}

function drawSegment(a, b, stroke) {
  const cx = canvas.width / devicePixelRatio / 2;
  const cy = canvas.height / devicePixelRatio / 2;
  ctx.lineCap = 'round';
  ctx.lineWidth = stroke.size;
  ctx.strokeStyle = b.color;
  for (let i = 0; i < stroke.slices; i++) {
    const ang = (i * 2 * Math.PI) / stroke.slices;
    for (const flip of [1, -1]) {   // rotate + mirror
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(ang);
      ctx.scale(1, flip);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (const s of strokes) {
    for (let i = 1; i < s.points.length; i++) drawSegment(s.points[i - 1], s.points[i], s);
  }
}

function pos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left - r.width / 2, y: e.clientY - r.top - r.height / 2 };
}

function nextColor() {
  if ($('rainbow').checked) { hue = (hue + 2) % 360; return `hsl(${hue} 90% 60%)`; }
  return $('color').value;
}

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  const p = { ...pos(e), color: nextColor() };
  current = { slices: +$('slices').value, size: +$('size').value, points: [p] };
  strokes.push(current);
  drawSegment(p, p, current);
});
canvas.addEventListener('pointermove', e => {
  if (!current) return;
  const prev = current.points[current.points.length - 1];
  const p = { ...pos(e), color: nextColor() };
  current.points.push(p);
  drawSegment(prev, p, current);
});
const end = () => { current = null; };
canvas.addEventListener('pointerup', end);
canvas.addEventListener('pointercancel', end);

$('slices').addEventListener('input', e => { $('slicesVal').textContent = e.target.value; });
$('undo').onclick = () => { strokes.pop(); redraw(); };
$('clear').onclick = () => { strokes = []; redraw(); };
$('save').onclick = () => {
  const out = document.createElement('canvas');
  out.width = canvas.width; out.height = canvas.height;
  const o = out.getContext('2d');
  o.fillStyle = '#0e0e16'; o.fillRect(0, 0, out.width, out.height);
  o.drawImage(canvas, 0, 0);
  const a = document.createElement('a');
  a.download = 'doodle-symmetry.png';
  a.href = out.toDataURL('image/png');
  a.click();
};
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { strokes.pop(); redraw(); }
});

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
